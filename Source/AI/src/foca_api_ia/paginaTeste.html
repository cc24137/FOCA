<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload de Vídeo - Visão Computacional</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }
        .container {
            border: 2px dashed #ccc;
            padding: 20px;
            border-radius: 8px;
        }
        video {
            width: 100%;
            max-height: 300px;
            margin-top: 15px;
            display: none;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Enviar Vídeo para Análise</h2>
        <input type="file" id="videoInput" accept="video/*" onchange="previewVideo()">
        <br>
        <video id="videoPreview" controls></video>
        <br>
        <!-- Passamos o evento (e) e usamos preventDefault no clique -->
        <button type="button" id="uploadBtn" onclick="uploadVideo(event)">Enviar para a IA</button>
        <div id="status"></div>
    </div>

    <script>
        function previewVideo() {
            const input = document.getElementById('videoInput');
            const preview = document.getElementById('videoPreview');
            const file = input.files[0];

            if (file) {
                preview.src = URL.createObjectURL(file);
                preview.style.display = 'block';
            }
        }

        async function uploadVideo(event) {
            // Trava qualquer comportamento padrão de reload imediatamente
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const input = document.getElementById('videoInput');
            const status = document.getElementById('status');

            if (!input.files[0]) {
                alert("Por favor, selecione um vídeo primeiro!");
                return false;
            }

            const formData = new FormData();
            formData.append("file", input.files[0]);

            status.innerText = "Enviando e processando vídeo...";

            try {
                const response = await fetch("http://127.0.0.1:8000/processar-video/", {
                    method: "POST",
                    body: formData
                });

                if (response.ok) {
                    const result = await response.json();
                    status.innerText = "Sucesso: " + JSON.stringify(result);
                } else {
                    const errData = await response.json().catch(() => ({}));
                    status.innerText = "Erro no servidor: " + (errData.detail || response.statusText);
                }
            } catch (error) {
                console.error("Erro no Fetch:", error);
                status.innerText = "Erro na conexão com o servidor. Verifique se o FastAPI está rodando e se o CORS está ativo.";
            }

            return false; // Garantia extra contra submissão de formulário
        }
    </script>
</body>
</html>
